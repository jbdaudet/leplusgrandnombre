# Mosaic between the hero and the manifesto: analysis visuals and the
# questions clients ask, on muted colour tiles (4 columns x 3 rows on desktop).
# type: question | visuel ; large: true spans two columns.
# fond: background colour ; clair: true for dark text on a light background.
# Visuals: themes/lpgn/assets/img/situations/ (resized by Hugo; `rogne`
# crops that many pixels off the bottom before resizing).
cases:
  - type: question
    texte: "Pourquoi mes ventes stagnent alors que je dépense plus en pub ?"
    lien: "#demo"
    fond: "#FF6B35"
    large: true
  - type: visuel
    image: "img/situations/parcours.jpg"
    alt: "Graphe des parcours de navigation vers l'achat"
    fond: "#d9c9a8"
  - type: question
    texte: "Où ouvrir ma prochaine boutique ?"
    lien: "/applications/#geomarketing"
    fond: "#1f2a3a"
  - type: visuel
    image: "img/situations/privacy.jpg"
    alt: "Frise des réglementations sur la protection des données et des taux de consentement"
    fond: "#6b7385"
    large: true
  - type: visuel
    image: "img/situations/first-party.jpg"
    alt: "Schéma d'enrichissement des données clients first-party"
    fond: "#a3ad9f"
    large: true
    rogne: 45
  - type: question
    texte: "Quel message va vraiment toucher mes clients ?"
    lien: "/applications/#signal"
    fond: "#4a3440"
  - type: visuel
    image: "img/situations/app-site.jpg"
    alt: "Visites, ajouts au panier et achats, entre l'application et le site"
    fond: "#edebe5"
    large: true
  - type: question
    texte: "Mes indicateurs m'aident-ils vraiment à décider ?"
    lien: "/applications/#theshiftproject"
    fond: "#b5543a"
