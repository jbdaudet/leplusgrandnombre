<footer class="site-footer" role="contentinfo">
  <div class="container site-footer__inner">

    <p class="site-footer__copy">
      &copy; {{ now.Year }} {{ .Site.Title }}
    </p>
    <div class="site-footer__links">
      {{- with .Site.Params.linkedin }}
      <a href="{{ . }}" class="site-footer__link" target="_blank" rel="noopener noreferrer me">LinkedIn</a>
      {{- end }}
      <a href="/politique-de-confidentialite/" class="site-footer__link">Politique de confidentialité</a>
      <a href="#" class="site-footer__link" id="open-cookies">Choix des cookies</a>
    </div>

  </div>
</footer>
