<footer class="site-footer" role="contentinfo">
  <div class="container site-footer__inner">

    <p class="site-footer__copy">
      &copy; {{ now.Year }} {{ .Site.Title }}{{ with .Site.Params.siret }} · SIRET&nbsp;{{ . }}{{ end }}
    </p>
    <div class="site-footer__links">
      {{- with .Site.Params.linkedin }}
      <a href="{{ . }}" class="site-footer__link site-footer__link--icone" target="_blank" rel="noopener noreferrer me">{{ partial "icone-linkedin.html" . }}LinkedIn</a>
      {{- end }}
      <a href="/politique-de-confidentialite/" class="site-footer__link site-footer__link--icone">{{ partial "icone-cadenas.html" . }}Politique de confidentialité</a>
      <a href="#" class="site-footer__link site-footer__link--icone" id="open-cookies">{{ partial "icone-cookie.html" . }}Choix des cookies</a>
    </div>

  </div>
</footer>
