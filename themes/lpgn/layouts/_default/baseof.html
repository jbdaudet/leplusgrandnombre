<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" dir="{{ if .Site.Language.Params.rtl }}rtl{{ else }}ltr{{ end }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  <div class="site-wrapper">

    {{- partial "header.html" . -}}

    <main class="site-main" id="main-content" role="main">
      {{- block "main" . }}{{- end }}
    </main>

    {{- partial "footer.html" . -}}

  </div>

  <script>
    /* Cookie banner reopener — tarteaucitron loads with defer, so check availability at click time */
    (function () {
      var btn = document.getElementById('open-cookies');
      if (!btn) return;
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        if (typeof tarteaucitron !== 'undefined' && tarteaucitron.userInterface) {
          tarteaucitron.userInterface.openAlert();
        }
      });
    })();

    /* Header: transparent at top, blurred on scroll */
    (function () {
      var header = document.querySelector('.site-header');
      if (!header) return;
      function checkScroll() {
        if (window.scrollY > 50) {
          header.classList.add('is-scrolled');
        } else {
          header.classList.remove('is-scrolled');
        }
      }
      window.addEventListener('scroll', checkScroll, { passive: true });
      checkScroll();
    })();

    /* Floating scrollbar: the native one is hidden in CSS (it took its own
       lane, a light strip beside dark sections). Mouse/trackpad devices only. */
    (function () {
      if (!matchMedia('(pointer: fine)').matches) return;
      var bar = document.createElement('div');
      bar.className = 'scrollbar';
      bar.setAttribute('aria-hidden', 'true');
      var thumb = document.createElement('div');
      thumb.className = 'scrollbar__thumb';
      bar.appendChild(thumb);
      document.body.appendChild(bar);

      var doc = document.documentElement, idle;
      function place() {
        var vh = innerHeight, full = doc.scrollHeight;
        if (full <= vh + 1) { bar.hidden = true; return; }
        bar.hidden = false;
        var h = Math.max(40, vh * vh / full);
        thumb.style.height = h + 'px';
        thumb.style.top = (scrollY / (full - vh)) * (vh - h) + 'px';
      }
      addEventListener('scroll', function () {
        place();
        bar.classList.add('is-active');
        clearTimeout(idle);
        idle = setTimeout(function () { bar.classList.remove('is-active'); }, 900);
      }, { passive: true });
      addEventListener('resize', place, { passive: true });
      addEventListener('load', place);
      place();

      // drag the thumb to scroll
      var startY, startScroll;
      thumb.addEventListener('pointerdown', function (e) {
        startY = e.clientY; startScroll = scrollY;
        thumb.setPointerCapture(e.pointerId);
        thumb.classList.add('is-dragging');
        e.preventDefault();
      });
      thumb.addEventListener('pointermove', function (e) {
        if (!thumb.classList.contains('is-dragging')) return;
        var vh = innerHeight, full = doc.scrollHeight;
        var ratio = (full - vh) / (vh - thumb.offsetHeight);
        scrollTo({ top: startScroll + (e.clientY - startY) * ratio, behavior: 'instant' });
      });
      function lacher() { thumb.classList.remove('is-dragging'); }
      thumb.addEventListener('pointerup', lacher);
      thumb.addEventListener('pointercancel', lacher);
    })();

    /* References carousel: arrows and dots drive the horizontal snap track,
       which also scrolls natively (swipe, trackpad). It moves on by itself
       every AUTO ms while on screen, and holds while hovered, focused or
       touched (never under prefers-reduced-motion). */
    (function () {
      var track = document.querySelector('.references__track');
      if (!track) return;
      var slides = track.children;
      var prev = document.querySelector('.references__btn--prev');
      var next = document.querySelector('.references__btn--next');
      var dots = document.querySelectorAll('.references__dot');
      if (!prev || slides.length < 2) return;
      function courant() { return Math.round(track.scrollLeft / track.clientWidth); }
      function aller(i) {
        i = Math.max(0, Math.min(slides.length - 1, i));
        track.scrollTo({ left: slides[i].offsetLeft - track.offsetLeft, behavior: 'smooth' });
      }
      function maj() {
        var i = Math.min(slides.length - 1, Math.round(track.scrollLeft / (track.scrollWidth - track.clientWidth) * (slides.length - 1)));
        prev.disabled = i === 0;
        next.disabled = i === slides.length - 1;
        for (var k = 0; k < dots.length; k++) dots[k].classList.toggle('is-active', k === i);
      }
      prev.addEventListener('click', function () { aller(courant() - 1); relancer(); });
      next.addEventListener('click', function () { aller(courant() + 1); relancer(); });
      for (var k = 0; k < dots.length; k++) (function (k) { dots[k].addEventListener('click', function () { aller(k); relancer(); }); })(k);
      track.addEventListener('scroll', maj, { passive: true });
      addEventListener('resize', maj);
      maj();

      var AUTO = 7000;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var carousel = track.parentElement, timer = null, visible = false, tenu = false;
      function relancer() {
        clearInterval(timer); timer = null;
        if (visible && !tenu) timer = setInterval(function () {
          var i = courant();
          aller(i === slides.length - 1 ? 0 : i + 1);        // loops back to the first
        }, AUTO);
      }
      function tenir(v) { return function () { tenu = v; relancer(); }; }
      carousel.addEventListener('mouseenter', tenir(true));
      carousel.addEventListener('mouseleave', tenir(false));
      carousel.addEventListener('focusin', tenir(true));
      carousel.addEventListener('focusout', tenir(false));
      track.addEventListener('touchstart', relancer, { passive: true });
      new IntersectionObserver(function (es) {
        visible = es[0].isIntersecting; relancer();
      }, { threshold: 0.5 }).observe(carousel);
    })();

    /* Burger menu */
    (function () {
      var burger = document.querySelector('.burger');
      var nav = document.getElementById('main-nav');
      if (!burger || !nav) return;

      function closeMenu() {
        burger.classList.remove('is-open');
        nav.classList.remove('is-open');
        burger.setAttribute('aria-expanded', 'false');
      }

      burger.addEventListener('click', function () {
        var isOpen = burger.classList.toggle('is-open');
        nav.classList.toggle('is-open', isOpen);
        burger.setAttribute('aria-expanded', String(isOpen));
      });

      nav.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', closeMenu);
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeMenu();
      });
    })();

    /* Scroll reveal animations */
    (function () {
      var reveals = document.querySelectorAll('.reveal');
      if (!reveals.length) return;

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);

            /* Docking: when a reveal inside a dock fires, check if heading is visible to trigger body snap */
            var dock = entry.target.closest('.conviction__dock');
            if (dock && !dock.classList.contains('is-docked')) {
              var headingReveal = dock.querySelector('.conviction__tile--heading .reveal');
              if (headingReveal && headingReveal.classList.contains('is-visible')) {
                /* Heading is in — trigger the body to dock */
                setTimeout(function () { dock.classList.add('is-docked'); }, 200);
              }
            }
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

      reveals.forEach(function (el) { observer.observe(el); });

      /* Hero: Data / IA light up the moment you scroll. */
      var hero = document.querySelector('.hero');
      if (hero) {
        function onScroll() {
          hero.classList.toggle('is-scrolled', window.scrollY > 0);
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
      }
    })();

    /* Binary "data" cloud, contained to the manifesto zone. Three scroll phases:
       (1) FILL — 0s and 1s drift freely, filling the whole zone (chaos);
       (2) ORGANISE — they snap onto a regular grid, still filling the space;
       (3) COLLAPSE — they converge onto the big "data" word and only then fade. */
    (function () {
      var section = document.querySelector('.manifesto');
      var burst = section && section.querySelector('.data-burst');
      var word = document.querySelector('.manifesto__data');
      if (!section || !burst || !word) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var COUNT = 140, pad = 14;
      var W = 0, H = 0;
      var bits = [];
      var sums = [];   /* per-column running-sum elements, indexed by column */
      var obstacles = [];   /* keep-out boxes (the text) the drift avoids */
      var floorY = 0;
      var prog = 0;   /* scroll progress through the section, 0..1 */
      var t = 0;      /* frame counter, drives the in-place float */

      function rand(a, b) { return a + Math.random() * (b - a); }
      function smooth(e0, e1, x) {
        var s = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
        return s * s * (3 - 2 * s);
      }

      function build() {
        burst.innerHTML = '';
        bits = [];
        var br = burst.getBoundingClientRect();
        W = br.width; H = br.height;
        /* density scales with viewport: mobile gets far fewer digits in its thin side strips */
        COUNT = W < 560 ? 40 : (W < 900 ? 80 : 140);

        /* keep-out boxes: the centred text (generous margin) */
        obstacles = [];
        ['.manifesto__movement', '.manifesto__invite'].forEach(function (sel) {
          var e = section.querySelector(sel);
          if (!e) return;
          /* measure the FINAL layout box (the .reveal animation starts translated, which
             would otherwise put the keep-out box in the wrong place) */
          var prevT = e.style.transform;
          e.style.transform = 'none';
          var r = e.getBoundingClientRect();
          e.style.transform = prevT;
          obstacles.push({
            x0: r.left - br.left - 40, x1: r.right - br.left + 40,
            y0: r.top - br.top - 28, y1: r.bottom - br.top + 28
          });
        });
        function blocked(x, y) {
          for (var j = 0; j < obstacles.length; j++) {
            var bl = obstacles[j];
            if (x > bl.x0 && x < bl.x1 && y > bl.y0 && y < bl.y1) return true;
          }
          return false;
        }

        /* clean, fully-filled grid covering the whole zone, minus the keep-out boxes */
        var cols = Math.max(1, Math.round(Math.sqrt(COUNT * (W / Math.max(1, H)))));
        var rows = Math.ceil(COUNT / cols);
        var cw = (W - pad * 2) / cols;
        var ch = (H - pad * 2) / rows;
        var cells = [];
        for (var rIdx = 0; rIdx < rows; rIdx++) {
          for (var c = 0; c < cols; c++) {
            var gx = pad + cw * (c + 0.5);
            var gy = pad + ch * (rIdx + 0.5);
            if (blocked(gx, gy)) continue;
            cells.push({ x: gx, y: gy, col: c });
          }
        }

        floorY = H - pad;
        sums = [];
        var small = W < 560;

        /* exactly one bit per free cell — no empty nodes, no superpositions */
        for (var i = 0; i < cells.length; i++) {
          var el = document.createElement('span');
          el.className = 'data-bit';
          el.textContent = Math.random() < 0.5 ? '0' : '1';
          if (Math.random() < 0.16) el.style.color = 'var(--color-accent)';
          burst.appendChild(el);
          var cell = cells[i];
          var sp = rand(1.2, 3.0), an = rand(0, Math.PI * 2);
          /* seed outside the keep-out zones so the text is clear from frame one */
          var px = rand(pad, W - pad), py = rand(pad, H - pad), tries = 0;
          while (blocked(px, py) && tries++ < 30) { px = rand(pad, W - pad); py = rand(pad, H - pad); }
          bits.push({
            el: el,
            val: el.textContent === '1' ? 1 : 0,
            col: cell.col, colx: cell.x,
            x: px, y: py,
            vx: Math.cos(an) * sp, vy: Math.sin(an) * sp,
            gx: cell.x, gy: cell.y,
            fa: rand(0, Math.PI * 2),           /* float phase */
            fs: rand(0.012, 0.024),             /* float speed */
            far: rand(2.5, 5),                  /* float radius */
            sc: rand(0.8, small ? 1.05 : 1.6),
            op: rand(0.5, 0.95)
          });
          /* one running-sum element per column, parked on the floor */
          if (!sums[cell.col]) {
            var s = document.createElement('span');
            s.className = 'data-bit data-sum';
            s.style.transform = 'translate3d(' + cell.x.toFixed(1) + 'px,' + floorY.toFixed(1) + 'px,0)';
            s.style.opacity = '0';
            burst.appendChild(s);
            sums[cell.col] = { el: s, x: cell.x };
          }
        }
      }

      function onScroll() {
        var vh = window.innerHeight;
        var r = section.getBoundingClientRect();
        /* 0 when section top hits viewport bottom, 1 when section bottom hits top */
        prog = Math.max(0, Math.min(1, (vh - r.top) / (vh + r.height)));
      }

      function frame() {
        t++;
        var grid = smooth(0.20, 0.52, prog);     /* chaos -> grid */
        var fall = smooth(0.62, 0.92, prog);      /* grid  -> floor */
        var drift = 1 - grid;                     /* free motion only before the grid forms */
        var floatAmt = grid * (1 - smooth(0.52, 0.62, prog));   /* float on the grid; fully stilled before the fall */
        var drop = H * fall * fall;               /* gravity: same downward fall for every digit */
        var colSum = [];                          /* recomputed each frame from what has landed */
        for (var i = 0; i < bits.length; i++) {
          var b = bits[i];
          var px0 = b.x, py0 = b.y;
          b.x += b.vx * drift; b.y += b.vy * drift;
          if (b.x < pad) { b.x = pad; b.vx = -b.vx; } else if (b.x > W - pad) { b.x = W - pad; b.vx = -b.vx; }
          if (b.y < pad) { b.y = pad; b.vy = -b.vy; } else if (b.y > H - pad) { b.y = H - pad; b.vy = -b.vy; }
          /* bounce off the keep-out boxes so digits never drift over the text */
          for (var o = 0; o < obstacles.length; o++) {
            var ob = obstacles[o];
            if (b.x > ob.x0 && b.x < ob.x1 && b.y > ob.y0 && b.y < ob.y1) {
              b.x = px0; b.y = py0; b.vx = -b.vx; b.vy = -b.vy; break;
            }
          }
          /* chaos -> grid, with a gentle drift around the grid point once settled */
          var fx = Math.cos(t * b.fs + b.fa) * b.far * floatAmt;
          var fy = Math.sin(t * b.fs * 1.3 + b.fa) * b.far * floatAmt;
          var bx = b.x + (b.gx - b.x) * grid + fx;
          var by = b.y + (b.gy - b.y) * grid + fy;
          var ry = by + drop;
          if (ry >= floorY) {
            /* landed: the digit is absorbed into its column's running sum */
            b.el.style.opacity = '0';
            colSum[b.col] = (colSum[b.col] || 0) + b.val;
          } else {
            /* hide a falling digit while it crosses a keep-out box (text stays clean) */
            var hidden = false;
            for (var o2 = 0; o2 < obstacles.length; o2++) {
              var ob2 = obstacles[o2];
              if (bx > ob2.x0 && bx < ob2.x1 && ry > ob2.y0 && ry < ob2.y1) { hidden = true; break; }
            }
            b.el.style.transform = 'translate3d(' + bx.toFixed(1) + 'px,' + ry.toFixed(1) + 'px,0) scale(' + b.sc.toFixed(2) + ')';
            b.el.style.opacity = hidden ? '0' : b.op.toFixed(3);
          }
        }
        /* show each column's accumulated total on the floor */
        for (var c2 = 0; c2 < sums.length; c2++) {
          var sm = sums[c2];
          if (!sm) continue;
          if (colSum[c2] === undefined) { sm.el.style.opacity = '0'; continue; }
          sm.el.textContent = colSum[c2];
          sm.el.style.opacity = '1';
        }
        requestAnimationFrame(frame);
      }

      build();
      onScroll();
      frame();
      window.addEventListener('scroll', onScroll, { passive: true });
      var rt;
      window.addEventListener('resize', function () {
        clearTimeout(rt);
        rt = setTimeout(function () { build(); onScroll(); }, 200);
      });
    })();

    /* Delta demo, step by step. Reference: brief-demo-site/demo-scroll-test.html.
       The scroll is a GESTURE, not a position: one wheel notch / swipe = one
       step, whatever its amplitude; gestures during a transition are ignored.
       Only going DOWN is captured: scrolling up always leaves the demo in one
       go, and the demo silently rewinds once it is out of sight below.
       Rendering is 100% images (no <video> displayed: GPU drivers retouch the
       video layer's colours, and drawImage(video) is unreliable on Windows):
       transitions are WebP frame sequences drawn on a canvas, still states are
       HD WebP shown in an overlay. The mp4 is only the reduced-motion fallback.
       Site adaptations vs the reference: the fixed header slides away while
       the demo is under it, the anti-crossing wall uses behavior:'instant'
       (html has scroll-behavior:smooth), the ~10 MB of images load only on
       approach, and the section is sticky in a taller track (.demo-piste) so
       that an overshoot the script cannot cancel never moves the picture. */
    (function () {
      var section = document.querySelector('.demo-steps');
      if (!section) return;
      var video = section.querySelector('video');
      var toile = section.querySelector('canvas');
      var pinceau = toile.getContext('2d');
      var calque = section.querySelector('.arret');
      // the track: all scroll positions are measured on it (the section is sticky)
      var piste = section.parentElement;
      var libre = false;        // sequence over: spare height removed, scroll free
      function liberer() { libre = true; piste.classList.add('is-libre'); }

      // "Passer la démo": free the scroll, then glide to what follows the demo
      var passer = section.querySelector('.demo-passer');
      if (passer) passer.addEventListener('click', function () {
        liberer();
        var suite = piste.nextElementSibling;
        // stop where the band starts just under the (reappearing) site header
        if (suite) scrollTo({ top: scrollY + suite.getBoundingClientRect().top - (header ? header.offsetHeight : 0), behavior: 'smooth' });
      });

      // hide the header as long as the demo sits under it (keeps the whole frame visible)
      var header = document.querySelector('.site-header');
      if (header) {
        var cacheHeader = function () {
          var r = piste.getBoundingClientRect(), h = header.offsetHeight;
          header.classList.toggle('is-hidden', r.top < h && r.bottom > h);
        };
        addEventListener('scroll', cacheHeader, { passive: true });
        addEventListener('resize', cacheHeader, { passive: true });
        cacheHeader();
      }

      // accessibility: visitor refuses animations -> plain video with controls
      // (the only case where the mp4 is loaded)
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        video.src = section.getAttribute('data-video');
        video.poster = section.getAttribute('data-poster');
        video.preload = 'metadata';
        video.controls = true;
        section.classList.add('demo-steps--video');
        liberer();
        return;
      }

      // 12 states; between two consecutive states, a frame sequence.
      // SEGMENTS = frame count of each transition (files t{ss}-{fff}.webp): goes with the files
      var SEGMENTS = [18, 23, 22, 18, 12, 20, 22, 22, 22, 22, 20];
      var CADENCE = 28;         // frames drawn per second (sequence sampled at 16 fps -> ~1.75x real time)
      var SEUIL = 12;           // minimal gesture amplitude (deltaY)
      var ACCALMIE = 250;       // ms of calm required between two gestures (anti-inertia)
      var SORTIE = 500;         // ms of calm before giving the scroll back at the end
      var FIN = SEGMENTS.length;          // index of the last state

      var gabaritSeq = section.getAttribute('data-sequence');
      var gabaritArr = section.getAttribute('data-arrets');
      function ch2(n) { return ('0' + n).slice(-2); }
      function ch3(n) { return ('00' + n).slice(-3); }

      // preload, ~2 screens before the section shows up: the 12 HD stills first,
      // then the transitions segment by segment, in playing order
      var arrets = [], frames = SEGMENTS.map(function () { return []; });
      var charge = false;
      function charger() {
        if (charge) return;
        charge = true;
        for (var i = 0; i <= FIN; i++) {
          var im = new Image();
          im.src = gabaritArr.replace('{nn}', ch2(i + 1));
          arrets.push(im);
        }
        (function suite(s) {
          if (s >= FIN) return;
          var restants = SEGMENTS[s];
          for (var f = 1; f <= SEGMENTS[s]; f++) (function (f) {
            var im = new Image();
            im.onload = im.onerror = function () { if (--restants === 0) suite(s + 1); };
            im.src = gabaritSeq.replace('{ss}', ch2(s + 1)).replace('{fff}', ch3(f));
            frames[s][f - 1] = im;
          })(f);
        })(0);
      }
      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
          if (entries[0].isIntersecting) { charger(); io.disconnect(); }
        }, { rootMargin: '200% 0px' });
        io.observe(section);
      } else {
        charger();
      }

      var idx = 0, anim = null, prev = 0;
      var enAttente = false;    // one gesture made during a transition, played right after it
      var finTransition = 0;    // when the last transition ended
      // anim = { s: segment being played, pos: floating frame index }

      function enTransition() { return anim !== null; }

      function pas() {
        anim = { s: idx, pos: 0 };
        idx++;
      }

      // new gesture vs inertia of the same one: a trackpad keeps sending
      // decreasing deltas for 1-2 s after a swipe. A gesture is NEW after a
      // pause (ACCALMIE) or when the delta rises sharply again (fresh swipe
      // during the inertia tail, not within the 150 ms ramp-up of the same
      // swipe). A fast-spun mouse wheel = one gesture.
      var dernierEvt = 0, dernierDelta = 0, debutGeste = -1e9;
      function nouveauGeste(delta, t) {
        var d = Math.abs(delta);
        var nouveau = d >= SEUIL && (t - dernierEvt > ACCALMIE ||
          (d > dernierDelta * 1.6 + 4 && t - debutGeste > 150));
        dernierEvt = t; dernierDelta = d;
        if (nouveau) debutGeste = t;
        return nouveau;
      }

      // is the section "engaged" (filling the screen, ready to capture the wheel)?
      function engagee() {
        var r = piste.getBoundingClientRect();
        return r.top < innerHeight * 0.25 && r.bottom > innerHeight * 0.75;
      }

      // engaged but not aligned: realign while the step plays (the gesture is not lost)
      var alignement = 0;
      function malAlignee() { return Math.abs(piste.getBoundingClientRect().top) > 4; }
      function recale() {
        var t = performance.now();
        if (t - alignement < 700) return;           // one realignment at a time
        alignement = t;
        scrollTo({ top: scrollY + piste.getBoundingClientRect().top, behavior: 'smooth' });
      }

      // one gesture = one step; a gesture during a transition is queued (one max)
      function geste() {
        if (malAlignee()) recale();
        if (enTransition()) { enAttente = true; return; }
        pas();
      }

      // anti-crossing wall: a violent scroll down must never carry the page past
      // the section until the sequence is over. The realignment is SYNCHRONOUS,
      // inside the scroll listener (an IntersectionObserver fires too late).
      // A scroll the browser would not let us cancel (gesture started before
      // the demo) overshoots into the track's spare height: unseen.
      var dernierY = scrollY, descend = true;
      addEventListener('scroll', function () {
        if (scrollY !== dernierY) descend = scrollY > dernierY;
        var r = piste.getBoundingClientRect();
        if (r.bottom > 0 && r.top < innerHeight) {                // track on screen
          if (descend && !libre && r.top < -4) {
            scrollTo({ top: scrollY + r.top, behavior: 'instant' });  // sharp: kills the inertia
            alignement = performance.now();
          }
        } else if (r.top >= innerHeight && (idx !== 0 || anim || libre)) {
          idx = 0; anim = null; enAttente = false;                 // left upwards: rewind, unseen
          libre = false; piste.classList.remove('is-libre');
        }
        dernierY = scrollY;
      }, { passive: true });

      addEventListener('wheel', function (e) {
        if (!engagee()) return;
        if (e.deltaY <= 0) return;     // going up: never captured, one scroll leaves
        var t = performance.now();
        var nouveau = nouveauGeste(e.deltaY, t);
        // at the end, give the scroll back once the last view is SETTLED: the
        // inertia of the last step is held, a new gesture leaves at once (and
        // the loop frees the scroll anyway SORTIE ms after the view settled)
        if (idx === FIN) {
          if (!libre) {
            if (!enTransition() && nouveau) liberer();
            else e.preventDefault();
          }
          return;
        }
        e.preventDefault();
        if (nouveau) geste();
      }, { passive: false });

      // touch: one swipe = one step
      var touchY = null;
      addEventListener('touchstart', function (e) { touchY = e.touches[0].clientY; }, { passive: true });
      addEventListener('touchmove', function (e) {
        if (touchY == null || !engagee()) return;
        var d = touchY - e.touches[0].clientY;
        if (Math.abs(d) < 30) return;
        if (d < 0) { touchY = null; return; }   // swiping back up: never captured
        if (idx === FIN) {
          if (!libre) {
            if (!enTransition()) liberer();
            else e.preventDefault();
          }
          touchY = null; return;
        }
        e.preventDefault();
        geste();
        touchY = null;
      }, { passive: false });

      function prete(im) { return im && im.complete && im.naturalWidth > 0; }
      function dessine(im) { pinceau.drawImage(im, 0, 0, toile.width, toile.height); }

      var fondDessine = -1;   // last still painted in the canvas (under the overlay)

      function boucle(now) {
        var dt = Math.min((now - prev) / 1000, 0.05) || 0.016; prev = now;
        if (anim) {
          var seq = frames[anim.s];
          var cible = Math.min(anim.pos + CADENCE * dt, seq.length - 1);
          var im = seq[Math.round(cible)];
          if (prete(im)) {               // frame not loaded yet -> hold the previous one
            anim.pos = cible;
            dessine(im);
            fondDessine = -1;
            if (anim.pos >= seq.length - 1) {
              anim = null;
              finTransition = now;
              if (enAttente) { enAttente = false; if (idx < FIN) pas(); }   // queued gesture
            }
          }
        }
        if (!libre && idx === FIN && !anim && now - finTransition > SORTIE) liberer();
        var posee = !anim;
        if (posee && arrets[idx]) {
          if (calque.src !== arrets[idx].src) calque.src = arrets[idx].src;
          // the canvas under the overlay gets the still too: never an empty background
          if (fondDessine !== idx && prete(arrets[idx])) { dessine(arrets[idx]); fondDessine = idx; }
        }
        calque.style.opacity = posee && prete(arrets[idx]) ? '1' : '0';
        requestAnimationFrame(boucle);
      }
      requestAnimationFrame(boucle);
    })();

    /* Floating network graph — hero background */
    (function () {
      var canvas = document.querySelector('.hero__network');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var w, h, nodes = [];
      var NODE_COUNT = 50;
      var CONNECT_DIST = 150;
      var NODE_RADIUS = 2.5;
      var ACCENT = [255, 107, 53];
      var REPULSE_RADIUS = 180;
      var REPULSE_STRENGTH = 0.4;

      function resize() {
        var rect = canvas.parentElement.getBoundingClientRect();
        w = rect.width;
        h = rect.height;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function init() {
        resize();
        nodes = [];
        for (var i = 0; i < NODE_COUNT; i++) {
          nodes.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3,
            r: NODE_RADIUS + Math.random() * 1.5
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);

        /* Draw edges between nearby nodes */
        for (var i = 0; i < nodes.length; i++) {
          for (var j = i + 1; j < nodes.length; j++) {
            var dx = nodes[i].x - nodes[j].x;
            var dy = nodes[i].y - nodes[j].y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < CONNECT_DIST) {
              var alpha = (1 - dist / CONNECT_DIST) * 0.2;
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.strokeStyle = 'rgba(' + ACCENT[0] + ',' + ACCENT[1] + ',' + ACCENT[2] + ',' + alpha + ')';
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }
        }

        /* Draw nodes */
        for (var k = 0; k < nodes.length; k++) {
          var n = nodes[k];
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + ACCENT[0] + ',' + ACCENT[1] + ',' + ACCENT[2] + ', 0.25)';
          ctx.fill();
          /* Tiny bright center */
          ctx.beginPath();
          ctx.arc(n.x, n.y, 1, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + ACCENT[0] + ',' + ACCENT[1] + ',' + ACCENT[2] + ', 0.5)';
          ctx.fill();
        }
      }

      /* The clearing follows the text block (title + subtitle, bottom-left):
         an ellipse around its box, with a margin, measured in hero coords */
      var bloc = canvas.parentElement.querySelector('.hero__content .container');
      var zone = { cx: 0, cy: 0, rx: 1, ry: 1 };
      function mesurerZone() {
        if (!bloc) return;
        var p = canvas.parentElement.getBoundingClientRect();
        // the extent of the text itself (the paragraphs span the whole row)
        function encre(el) {
          var r = document.createRange();
          r.selectNodeContents(el || bloc);
          return r.getBoundingClientRect();
        }
        var a = encre(bloc.querySelector('.hero__phrase')), b = encre(bloc.querySelector('.hero__subtitle'));
        var left = Math.min(a.left, b.left), right = Math.max(a.right, b.right);
        zone.cx = (left + right) / 2 - p.left;
        zone.cy = (a.top + b.bottom) / 2 - p.top;
        zone.rx = (right - left) / 2 * 1.25 + 60;
        zone.ry = (b.bottom - a.top) / 2 * 1.4 + 60;
      }

      function update() {
        for (var i = 0; i < nodes.length; i++) {
          var n = nodes[i];
          /* Repulsive force from the text block */
          var dx = n.x - zone.cx;
          var dy = n.y - zone.cy;
          var rx = zone.rx;
          var ry = zone.ry;
          var normDist = Math.sqrt((dx * dx) / (rx * rx) + (dy * dy) / (ry * ry));
          if (normDist < 1) {
            var force = (1 - normDist) * REPULSE_STRENGTH;
            var angle = Math.atan2(dy, dx);
            n.vx += Math.cos(angle) * force;
            n.vy += Math.sin(angle) * force;
          }
          /* Dampen velocity to prevent runaway */
          n.vx *= 0.99;
          n.vy *= 0.99;
          /* Minimum drift so nodes don't freeze */
          if (Math.abs(n.vx) < 0.1) n.vx += (Math.random() - 0.5) * 0.05;
          if (Math.abs(n.vy) < 0.1) n.vy += (Math.random() - 0.5) * 0.05;

          n.x += n.vx;
          n.y += n.vy;
          /* Bounce off edges gently */
          if (n.x < 0 || n.x > w) n.vx *= -1;
          if (n.y < 0 || n.y > h) n.vy *= -1;
          n.x = Math.max(0, Math.min(w, n.x));
          n.y = Math.max(0, Math.min(h, n.y));
        }
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      init();
      mesurerZone();
      loop();
      window.addEventListener('resize', function () { resize(); mesurerZone(); });
      window.addEventListener('load', mesurerZone);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(mesurerZone);
    })();
  </script>

</body>
</html>
